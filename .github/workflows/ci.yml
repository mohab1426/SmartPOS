name: SmartPOS CI

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest==8.3.4 ruff==0.8.4
      - run: python -m compileall -q app.py database.py services tests scripts import_legacy_database.py ui_theme.py theme_tokens.py login_dialog.py app_version.py startup_guard.py
      - run: python -m ruff check .
      - run: python -m pytest -q

  gui-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest==8.3.4
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q -rs
      - run: python scripts/layout_regression_test.py --platform offscreen --out layout_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout_screenshots
          path: layout_output/**
